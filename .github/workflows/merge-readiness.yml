name: PR verification

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Project verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.3"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run the project verification contract
        run: npm run verify -- --install-browser
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-failure-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
            /tmp/klinikaid-verify-*

  merge-readiness:
    name: Merge readiness
    if: always()
    needs: verification
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require all verification gates to succeed
        env:
          VERIFICATION_RESULT: ${{ needs.verification.result }}
        run: |
          if [ "$VERIFICATION_RESULT" != success ]; then
            echo "Project verification did not pass: $VERIFICATION_RESULT"
            exit 1
          fi
          echo "Project verification passed. Ready for acceptance review." >> "$GITHUB_STEP_SUMMARY"
